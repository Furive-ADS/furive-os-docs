<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-labelledby="title desc">
  <title id="title">Furive OS, HMI, MGMT, DLS 연결 구조</title>
  <desc id="desc">1PC에 Autoware, HMI, MGMT, DLS를 함께 배정하는 구성과 A-ECU·HMI-ECU로 분산한 경우의 Zenoh 및 로컬 메시지 경계</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="1" stop-color="#0c2230"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102431"/>
      <stop offset="1" stop-color="#0d1b27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#74b7ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#55d6a4"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#edf5fa}
      .small{font-size:18px;fill:#9fb2c0}
      .micro{font-size:15px;fill:#8096a5}
      .box-title{font-size:22px;font-weight:750}
      .section{font-size:27px;font-weight:800;letter-spacing:.03em}
      .chip{font-size:16px;font-weight:700}
      .line-blue{stroke:#74b7ee;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}
      .line-green{stroke:#55d6a4;stroke-width:4;fill:none;marker-end:url(#arrowGreen)}
      .line-dash{stroke:#71889a;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="1400" height="1130" rx="28" fill="url(#bg)"/>
  <text x="54" y="60" class="section">Furive OS 차량 화면·데이터 경로</text>
  <text x="54" y="91" class="small">독립 패키지는 같은 ROS 데이터에 연결되지만 lifecycle·상태·설정은 각 패키지가 따로 소유합니다.</text>

  <rect x="42" y="113" width="1316" height="163" rx="20" fill="#102b2b" stroke="#55d6a4" stroke-width="2"/>
  <text x="70" y="150" class="section">1PC · 한 PC에 함께 설치·실행</text>
  <rect x="70" y="171" width="460" height="51" rx="12" fill="#152d3a" stroke="#396078"/>
  <text x="300" y="204" text-anchor="middle" class="box-title">Autoware · 기본 운영</text>
  <rect x="870" y="171" width="460" height="51" rx="12" fill="#152d3a" stroke="#396078"/>
  <text x="1100" y="204" text-anchor="middle" class="box-title">배정된 HMI · MGMT · DLS</text>
  <path d="M545 196H855" stroke="#55d6a4" stroke-width="3"/>
  <text x="700" y="186" text-anchor="middle" class="micro">로컬 ROS / DDS</text>
  <text x="70" y="252" class="small">플랫폼의 1PC 배정 · 한 Package Manager · 같은 PC의 Gateway와 화면 · 자원 공유</text>
  <text x="54" y="312" class="box-title">분산 구성 · 자율주행과 로깅·부가 기능의 부하 분리 권장</text>
  <g transform="translate(0 200)">
  <g filter="url(#shadow)">
    <rect x="42" y="130" width="470" height="530" rx="24" fill="#0b1a25" stroke="#2b4b60" stroke-width="2"/>
    <rect x="888" y="130" width="470" height="530" rx="24" fill="url(#edge)" stroke="#2b4b60" stroke-width="2"/>
  </g>

  <text x="70" y="174" class="section">A-ECU</text>
  <text x="916" y="174" class="section">HMI-ECU</text>

  <g>
    <rect x="76" y="205" width="400" height="92" rx="15" fill="#152d3a" stroke="#396078"/>
    <text x="98" y="241" class="box-title">Autoware · 차량 driver</text>
    <text x="98" y="270" class="small">ROS 2 / CycloneDDS · domain 17</text>

    <rect x="76" y="340" width="400" height="98" rx="15" fill="#122936" stroke="#396078"/>
    <text x="98" y="377" class="box-title">ROS Domain Bridge</text>
    <text x="98" y="406" class="small">승인된 topic·service와 방향만 전달</text>

    <rect x="76" y="483" width="400" height="118" rx="15" fill="#102b34" stroke="#3d786f"/>
    <text x="98" y="521" class="box-title">Zenoh Bridge · main</text>
    <text x="98" y="550" class="small">전송용 shadow domain 232</text>
    <rect x="98" y="568" width="250" height="24" rx="12" fill="#143f3a"/>
    <text x="223" y="586" text-anchor="middle" class="chip" fill="#83e4bd">node cert · exact peer-CN ACL</text>
  </g>

  <path d="M276 297 L276 340" class="line-blue"/>
  <path d="M276 438 L276 483" class="line-blue"/>

  <g>
    <rect x="924" y="205" width="398" height="88" rx="15" fill="#102b34" stroke="#3d786f"/>
    <text x="946" y="240" class="box-title">Zenoh Bridge · edge</text>
    <text x="946" y="269" class="small">ROS 2 / CycloneDDS · domain 17</text>

    <rect x="924" y="327" width="188" height="118" rx="15" fill="#152d3a" stroke="#3d6680"/>
    <text x="946" y="364" class="box-title">HMI</text>
    <text x="946" y="392" class="small">표시·경로·상태</text>
    <text x="946" y="416" class="micro">native ROS 2 adapter</text>
    <text x="946" y="436" class="micro">로컬 DDS · OS domain</text>

    <rect x="1134" y="327" width="188" height="118" rx="15" fill="#152d3a" stroke="#3d6680"/>
    <text x="1156" y="364" class="box-title">MGMT</text>
    <text x="1156" y="392" class="small">Telemetry Bridge</text>
    <text x="1156" y="416" class="micro">newline JSON stdio</text>
    <text x="1156" y="436" class="micro">Electron IPC</text>

    <rect x="924" y="480" width="188" height="126" rx="15" fill="#142b29" stroke="#3d786f"/>
    <text x="946" y="517" class="box-title">DLS</text>
    <text x="946" y="545" class="small">rosbag 기록·세션</text>
    <text x="946" y="573" class="micro">로컬 dataset</text>
    <text x="946" y="593" class="micro">→ 선택 NAS</text>

    <rect x="1134" y="480" width="188" height="126" rx="15" fill="#182631" stroke="#4d6577"/>
    <text x="1156" y="517" class="box-title">Dashboard</text>
    <text x="1156" y="545" class="small">표시·입력 adapter</text>
    <text x="1156" y="573" class="micro">DLS surface를</text>
    <text x="1156" y="593" class="micro">iframe으로 제공</text>
  </g>

  <path d="M1123 293 L1018 327" class="line-blue"/>
  <path d="M1123 293 L1228 327" class="line-blue"/>
  <path d="M1123 293 L1018 480" class="line-blue"/>
  <path d="M1134 543 L1112 543" class="line-dash"/>
  <path d="M1228 480 L1228 445" class="line-green"/>
  <text x="1242" y="465" class="micro">iframe</text>

  <path d="M476 542 C650 542 750 249 924 249" class="line-green"/>
  <rect x="561" y="340" width="278" height="112" rx="18" fill="#0d2731" stroke="#3b786c" stroke-width="2"/>
  <text x="700" y="374" text-anchor="middle" class="box-title">Zenoh / QUIC :7447</text>
  <text x="700" y="405" text-anchor="middle" class="small">TLS 1.3 · mutual TLS</text>
  <text x="700" y="433" text-anchor="middle" class="micro">일반 TCP endpoint와 비호환</text>

  <g filter="url(#shadow)">
    <rect x="42" y="700" width="1316" height="174" rx="22" fill="#0a1822" stroke="#2a485a" stroke-width="2"/>
  </g>
  <text x="70" y="740" class="box-title">Furive OS가 공통으로 맡는 것</text>
  <rect x="70" y="762" width="300" height="78" rx="14" fill="#122836" stroke="#31566d"/>
  <text x="90" y="792" class="box-title">Package Manager</text>
  <text x="90" y="819" class="small">의존성·시작/중지·health·로그</text>

  <rect x="390" y="762" width="300" height="78" rx="14" fill="#122836" stroke="#31566d"/>
  <text x="410" y="792" class="box-title">main ↔ edge 제어면</text>
  <text x="410" y="815" class="micro">JSON object stream · TCP 15001</text>
  <text x="410" y="834" class="micro">TLS 1.3 mutual TLS</text>

  <rect x="710" y="762" width="300" height="78" rx="14" fill="#122836" stroke="#31566d"/>
  <text x="730" y="792" class="box-title">Integration Gateway</text>
  <text x="730" y="815" class="micro">같은 PC의 요청·응답</text>
  <text x="730" y="834" class="micro">loopback · 127.0.0.1</text>

  <rect x="1030" y="762" width="300" height="78" rx="14" fill="#122836" stroke="#31566d"/>
  <text x="1050" y="792" class="box-title">독립성 경계</text>
  <text x="1050" y="815" class="micro">패키지 사이에 상태·정책을</text>
  <text x="1050" y="834" class="micro">복제하지 않음</text>

  <text x="70" y="901" class="micro">보안 요약: PC 간 ROS·제어면은 각각 mTLS로 연결합니다. HMI는 로컬 DDS를 사용하며, Dashboard와 Gateway는 loopback 경계에 둡니다.</text>
  </g>
</svg>
