    <rect width="510" height="78" rx="14" fill="#0d1a26" stroke="#27394a"/>
    <line x1="23" y1="25" x2="78" y2="25" class="control-link"/><text x="94" y="30" class="small">제어면 · 상태 / 명령</text>
    <line x1="23" y1="54" x2="78" y2="54" class="data-link"/><text x="94" y="59" class="small">ROS 데이터면</text>
    <line x1="286" y1="25" x2="341" y2="25" class="local-link"/><text x="357" y="30" class="small">동일 PC adapter</text>
    <rect x="286" y="46" width="55" height="17" rx="8.5" fill="#26394a"/><text x="357" y="59" class="small">단일 소유 경계</text>
  </g>

