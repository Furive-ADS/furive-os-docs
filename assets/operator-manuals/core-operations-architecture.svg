  <rect width="1800" height="1100" rx="34" fill="url(#background)"/><rect width="1800" height="1100" rx="34" fill="url(#grid)"/>
  <circle cx="1540" cy="70" r="160" fill="#3cbf99" opacity=".035" filter="url(#soft-glow)"/><circle cx="210" cy="930" r="190" fill="#4a9fe9" opacity=".035" filter="url(#soft-glow)"/>
  <rect width="12" height="1100" rx="6" fill="url(#green)"/>

  <g class="sans">
    <text x="58" y="55" class="eyebrow">FUTUREDRIVE · FURIVE OS</text>
    <text x="58" y="103" class="title">운영 핵심 구조</text>
    <text x="58" y="135" class="subtitle">화면은 명령을 전달하고, 실제 상태·정책·lifecycle은 각 단일 소유자가 처리합니다.</text>
  </g>
