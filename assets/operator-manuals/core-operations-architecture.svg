<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Furive OS 운영 핵심 구조</title>
  <desc id="desc">운용 화면, 단일 책임 소유자, main과 edge 실행 영역, 분리된 제어면과 ROS 데이터 경로를 보여 주는 운영 아키텍처입니다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111c"/><stop offset=".55" stop-color="#0a1623"/><stop offset="1" stop-color="#071019"/></linearGradient>
    <linearGradient id="main-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e2e"/><stop offset="1" stop-color="#0c1825"/></linearGradient>
    <linearGradient id="edge-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10231f"/><stop offset="1" stop-color="#0b1918"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#15283a"/><stop offset="1" stop-color="#112231"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42a5f5"/><stop offset="1" stop-color="#607dff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#40d5a5"/><stop offset="1" stop-color="#1ca67f"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbd66"/><stop offset="1" stop-color="#f47b50"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b69cff"/><stop offset="1" stop-color="#7a68e8"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aa1b7" stroke-opacity=".035" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="soft-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="16"/></filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto-start-reverse"><path d="M0 0 11 5.5 0 11Z" fill="#55aef6"/></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto-start-reverse"><path d="M0 0 11 5.5 0 11Z" fill="#42d8aa"/></marker>
    <style>
      .sans{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.eyebrow{font-size:15px;font-weight:800;letter-spacing:2.4px;fill:#55d4ad}.title{font-size:39px;font-weight:850;fill:#f5f9fc}.subtitle{font-size:18px;font-weight:500;fill:#92a7b9}.section-no{font-size:13px;font-weight:850;letter-spacing:1.7px;fill:#6f899d}.section-title{font-size:22px;font-weight:800;fill:#eaf2f8}.node-title{font-size:24px;font-weight:850;fill:#f4f8fb}.node-meta{font-size:15px;font-weight:650;fill:#8da4b7}.card-title{font-size:20px;font-weight:800;fill:#f1f6fa}.card-copy{font-size:15px;font-weight:540;fill:#a6b8c7}.owner{font-size:12px;font-weight:850;letter-spacing:1.25px}.small{font-size:13px;font-weight:650;fill:#9eb1c0}.tiny{font-size:12px;font-weight:650;fill:#8298aa}.tab{font-size:14px;font-weight:750;fill:#c7d7e4}.route-title{font-size:17px;font-weight:850;fill:#eef5fa}.route-copy{font-size:14px;font-weight:650;fill:#9db0c0}.chip{font-size:12px;font-weight:750;fill:#bcd0df}.footer{font-size:14px;font-weight:650;fill:#8da2b2}.panel{fill:#101d2a;stroke:#2b3c4d;stroke-width:1.6}.hairline{fill:none;stroke:#31485c;stroke-width:1.5}.local-link{fill:none;stroke:#516b80;stroke-width:2;stroke-dasharray:6 6}.control-link{fill:none;stroke:#55aef6;stroke-width:3;marker-start:url(#arrow-blue);marker-end:url(#arrow-blue)}.data-link{fill:none;stroke:#42d8aa;stroke-width:3.2;marker-start:url(#arrow-green);marker-end:url(#arrow-green)}
    </style>
