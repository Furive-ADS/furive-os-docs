    <circle cx="99" cy="588" r="9" fill="#1e88e5"/><text x="99" y="592" text-anchor="middle" font-size="11" font-weight="850" fill="#fff">1</text><text x="118" y="593" class="small">현재 상태</text>
    <circle cx="99" cy="617" r="9" fill="#1e88e5"/><text x="99" y="621" text-anchor="middle" font-size="11" font-weight="850" fill="#fff">2</text><text x="118" y="622" class="small">명령 결과 재확인</text>
    <rect x="79" y="665" width="206" height="125" rx="14" fill="#0b2220" stroke="#245348"/><text x="97" y="694" class="owner" fill="#43d3a6">운영 원칙</text>
