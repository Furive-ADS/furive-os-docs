<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">PC 한 대부터 시작하는 Furive OS</title>
<desc id="desc">1PC에서는 자율주행·운영과 배정된 HMI·로깅 패키지를 한 PC에 함께 설치합니다. 분산 엣지 컴퓨팅에서는 A-ECU가 자율주행·운영을, HMI-ECU가 로깅·부가 기능을 맡습니다. 두 구성 모두 플랫폼 배정과 같은 공통 운영 기반을 사용합니다.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9cddcb" stroke-opacity=".07"/></pattern>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#1c3c3b"/><stop offset="1" stop-color="#102b2d"/></linearGradient>
</defs>
<rect width="720" height="620" rx="24" fill="#102527"/>
<rect width="720" height="620" rx="24" fill="url(#grid)"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <text x="32" y="46" font-size="28" font-weight="700" fill="#edfff7">PC 한 대부터, 필요하면 분산</text>
  <rect x="32" y="70" width="656" height="50" rx="10" fill="#23483f" stroke="#71ccac" stroke-opacity=".55"/>
  <text x="360" y="102" text-anchor="middle" fill="#d5f1e6" font-size="19">플랫폼이 차량 · 센서 · 패키지와 실행 PC를 배정</text>

  <rect x="32" y="142" width="656" height="166" rx="14" fill="url(#panel)" stroke="#83debe" stroke-width="2"/>
  <text x="54" y="175" fill="#a1f2d5" font-size="24" font-weight="700">1PC</text>
  <text x="127" y="175" fill="#f3fff9" font-size="22" font-weight="700">한 PC에 함께 설치</text>
  <rect x="54" y="194" width="296" height="63" rx="9" fill="#132c2b" stroke="#527a6d"/>
  <rect x="370" y="194" width="296" height="63" rx="9" fill="#132c2b" stroke="#527a6d"/>
  <text x="202" y="222" text-anchor="middle" fill="#edfff7" font-size="20">Autoware · 운영 화면</text>
  <text x="202" y="246" text-anchor="middle" fill="#b3cec5" font-size="16">자율주행 · 기본 운영</text>
  <text x="518" y="222" text-anchor="middle" fill="#edfff7" font-size="20">HMI · DLS 등 부가 패키지</text>
  <text x="518" y="246" text-anchor="middle" fill="#b3cec5" font-size="16">함께 배정한 기능</text>
  <text x="54" y="287" fill="#b3cec5" font-size="17">한 설치 · 공통 실행 관리 · 로컬 ROS/DDS와 메시지</text>

  <text x="32" y="349" fill="#d8f4e9" font-size="23" font-weight="700">분산 엣지 컴퓨팅</text>
  <text x="280" y="349" fill="#a8c7be" font-size="18">자율주행과 부가 기능의 부하 분리 권장</text>
  <g fill="url(#panel)" stroke="#4e7770"><rect x="32" y="369" width="310" height="139" rx="14"/><rect x="378" y="369" width="310" height="139" rx="14"/></g>
  <g fill="#f3fff9" font-size="28" font-weight="700"><text x="54" y="408">A-ECU</text><text x="400" y="408">HMI-ECU</text></g>
  <g fill="#c4ddd3" font-size="20"><text x="54" y="443">Autoware · 기본 운영</text><text x="400" y="443">데이터 로깅 · 부가 기능</text></g>
  <g fill="#a8c7be" font-size="16"><text x="54" y="480">자율주행 PC</text><text x="400" y="480">부하를 분담하는 별도 PC</text></g>
  <path d="M343 443h34m-29-5-5 5 5 5m24-10 5 5-5 5" fill="none" stroke="#83debe" stroke-width="2"/>
  <text x="360" y="534" text-anchor="middle" fill="#a8c7be" font-size="16">PC 간 연결: 등록 · 상태 · 운용 요청 / ROS 데이터 전달</text>

  <rect x="32" y="554" width="656" height="42" rx="9" fill="#183831" stroke="#3c6759"/>
  <text x="360" y="581" fill="#cfebdf" font-size="18" text-anchor="middle">두 구성 모두 공통 설치 · 실행 · 상태 · 업데이트와 복구</text>
</g>
</svg>
