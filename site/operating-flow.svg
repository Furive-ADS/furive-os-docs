<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
  <title id="title">쓰던 GitHub 저장소에서 지원 차량까지</title>
  <desc id="desc">GitHub 저장소와 지원 차량을 Furive OS가 이어 줍니다. 연결된 프로그램의 자동 CI/CD 통합·검사와 배포·원격 업데이트는 Furive OS가 맡습니다. 세부 설치 절차가 아닌 제품의 역할을 보여주는 그림입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#94e4bf" stroke-width="1.8"/></marker>
  </defs>
  <rect width="720" height="330" rx="24" fill="#102527"/>
  <g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
    <text x="360" y="42" text-anchor="middle" fill="#cfebdf" font-size="24" font-weight="700">연결은 가볍게, 배포는 빠르게.</text>
    <g transform="translate(76 89)" fill="none" stroke="#a8dfc9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 0h50v69H8a8 8 0 0 1-8-8V8a8 8 0 0 1 8-8Z"/>
      <path d="M12 0v53M0 61a8 8 0 0 1 8-8h50M25 18h18M25 30h18"/>
    </g>
    <path d="M178 126H535" fill="none" stroke="#77c9a8" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="360" y="105" text-anchor="middle" fill="#edfff7" font-size="28" font-weight="700">Furive OS</text>
    <g transform="translate(567 92)" fill="none" stroke="#94e4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m8 31 11-25h57l11 25M4 31h87v30H4zM20 31h54M27 7v23M18 44h8m41 0h8"/>
      <path d="M10 61v9h14v-9m47 0v9h14v-9"/>
    </g>
    <g text-anchor="middle">
      <text x="106" y="208" fill="#edfff7" font-size="23" font-weight="700">GitHub 저장소</text>
      <text x="614" y="208" fill="#edfff7" font-size="23" font-weight="700">지원 차량</text>
      <text x="106" y="236" fill="#a8c7be" font-size="16">쓰던 개발 방식 그대로</text>
      <text x="614" y="236" fill="#a8c7be" font-size="16">간편한 설치 · 업데이트</text>
    </g>
    <rect x="148" y="273" width="424" height="39" rx="20" fill="#1b3c33"/>
    <text x="360" y="299" text-anchor="middle" fill="#cfe9df" font-size="18">Furive OS가 맡는 자동 CI/CD · 배포 · OTA</text>
  </g>
</svg>
