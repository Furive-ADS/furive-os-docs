<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
  <title id="title">GitHub 저장소에서 차량 배포까지</title>
  <desc id="desc">각 팀의 GitHub 저장소를 최소한의 정보로 연결합니다. CI/CD로 연결된 결과물을 자동 빌드·검사해 하나의 차량 버전으로 만들고, 지원 차량에 한 명령으로 설치하거나 OTA로 업데이트합니다. 실차에서 발견한 문제는 팀에서 수정하고 다시 통합·검사합니다. 업데이트 적용 후 정상 확인에 실패하면 이전 정상판으로 자동 복구합니다.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9cddcb" stroke-opacity=".06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#8fdbbf" stroke-width="1.8"/></marker>
  </defs>
  <rect width="720" height="570" rx="24" fill="#102527"/>
  <rect width="720" height="570" rx="24" fill="url(#grid)"/>
  <g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
    <text x="38" y="42" fill="#edfff7" font-size="25" font-weight="700">GitHub 저장소에서 차량 배포까지</text>
    <rect x="38" y="68" width="644" height="112" rx="12" fill="#183831" stroke="#4e7770"/>
    <text x="58" y="100" fill="#edfff7" font-size="21" font-weight="700">팀별 GitHub 저장소를 가볍게 연결</text>
    <g fill="#102b2d" stroke="#37594f">
      <rect x="58" y="121" width="174" height="38" rx="7"/>
      <rect x="244" y="121" width="174" height="38" rx="7"/>
      <rect x="430" y="121" width="232" height="38" rx="7"/>
    </g>
    <g fill="#cfe9df" font-size="17" text-anchor="middle">
      <text x="145" y="146">Autoware</text>
      <text x="331" y="146">VCU 연동 · 인지</text>
      <text x="546" y="146">센서 드라이버</text>
    </g>
    <g fill="none" stroke="#8fdbbf" stroke-width="2" marker-end="url(#arrow)">
      <path d="M360 180v19H186v21"/>
      <path d="M334 267h48"/>
      <path d="M534 314v36"/>
      <path d="M388 401h-48"/>
      <path d="M186 452v34"/>
      <path d="M38 516H16V124h16"/>
    </g>
    <rect x="38" y="226" width="296" height="88" rx="12" fill="#23483f" stroke="#71ccac"/>
    <text x="58" y="261" fill="#edfff7" font-size="23" font-weight="700">CI/CD 통합 · 검사</text>
    <text x="58" y="290" fill="#b3cec5" font-size="17">연결된 결과물의 자동 빌드 · 검사</text>
    <rect x="388" y="226" width="294" height="88" rx="12" fill="#183831" stroke="#4e7770"/>
    <text x="408" y="261" fill="#edfff7" font-size="23" font-weight="700">하나의 차량 버전</text>
    <text x="408" y="290" fill="#b3cec5" font-size="17">자동 검사를 통과한 배포 버전</text>
    <rect x="388" y="356" width="294" height="96" rx="12" fill="#94e4bf"/>
    <text x="408" y="391" fill="#142e26" font-size="23" font-weight="700">빠른 설치 · OTA</text>
    <text x="408" y="420" fill="#254d3e" font-size="17">업데이트 실패 시 이전 정상판 복구</text>
    <rect x="38" y="356" width="296" height="96" rx="12" fill="#183831" stroke="#4e7770"/>
    <text x="58" y="391" fill="#edfff7" font-size="23" font-weight="700">실차 검증</text>
    <text x="58" y="420" fill="#b3cec5" font-size="17">한 차량에서 기능과 복구 확인</text>
    <rect x="38" y="492" width="644" height="48" rx="10" fill="#23483f" stroke="#4e7770"/>
    <text x="360" y="522" text-anchor="middle" fill="#cfebdf" font-size="18">문제 발견 → 팀에서 수정 → 다시 통합 · 검사</text>
  </g>
</svg>
